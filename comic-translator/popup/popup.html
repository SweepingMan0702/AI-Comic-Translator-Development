<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-icon">📖</div>
      <div class="header-text">
        <h1>Comic Translator</h1>
        <p>AI 漫畫即時翻譯</p>
      </div>
    </header>

    <!-- Main content -->
    <main class="content">

      <!-- API Key 管理表單清單 -->
      <section class="card" id="apiKeySection">
        <div class="card-header">
          <span class="card-icon">🔑</span>
          <h2>Gemini API Key 清單</h2>
          <span class="key-count-badge" id="keyCountBadge">0 組 Key</span>
        </div>

        <div class="key-list" id="keyListContainer">
          <!-- 動態渲染 Key 項目 -->
        </div>

        <div class="add-key-form">
          <input
            type="password"
            id="newKeyInput"
            placeholder="貼上 Gemini API Key..."
            autocomplete="off"
            spellcheck="false"
          >
          <button class="btn btn-primary btn-sm" id="addNewKeyBtn">
            ＋ 新增
          </button>
        </div>

        <p class="api-status-msg" id="apiStatusMsg"></p>

        <!-- API Key 取得教學 -->
        <details class="guide">
          <summary>
            <span>如何取得 Gemini API Key？</span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </summary>
          <div class="guide-steps-container">
            <ol class="guide-steps">
              <li>前往 <a href="https://aistudio.google.com/" target="_blank" class="link">Google AI Studio ↗</a></li>
              <li>登入 Google 帳號</li>
              <li>點擊左側選單的 <strong>「Get API Key」</strong></li>
              <li>點擊 <strong>「Create API Key」</strong> 建立金鑰</li>
              <li>複製金鑰貼入上方欄位即可使用</li>
            </ol>
          </div>
        </details>
      </section>

      <!-- 翻譯設定 -->
      <section class="card" id="settingsSection">
        <div class="card-header">
          <span class="card-icon">⚙️</span>
          <h2>翻譯設定</h2>
        </div>

        <div class="setting-row">
          <label for="targetLang">目標語言</label>
          <select id="targetLang" class="select">
            <option value="zh-TW">繁體中文</option>
            <option value="zh-CN">簡體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="autoTranslate">自動翻譯新載入圖片</label>
          <div class="toggle-wrapper">
            <input type="checkbox" id="autoTranslate" class="toggle-input">
            <label for="autoTranslate" class="toggle-label"></label>
          </div>
        </div>
      </section>

      <!-- 操作按鈕 -->
      <section class="actions">
        <div class="btn-row">
          <button class="btn btn-action btn-translate" id="translatePage">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            翻譯本頁漫畫
          </button>
          <button class="btn btn-action btn-stop" id="stopTranslationBtn" title="中止所有正在排隊或執行的翻譯">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="5" width="14" height="14" rx="2"/>
            </svg>
            停止
          </button>
        </div>

        <div class="btn-row-sm">
          <button class="btn btn-sm btn-secondary" id="reTranslatePage">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            重新翻譯
          </button>
          <button class="btn btn-sm btn-danger" id="clearTranslations">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4h6v2"/>
            </svg>
            清除翻譯
          </button>
        </div>
      </section>

      <!-- 統計資訊 -->
      <section class="stats-card" id="statsSection">
        <div class="stat-item">
          <span class="stat-value" id="statTranslated">0</span>
          <span class="stat-label">已翻譯圖片</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value" id="statPending">0</span>
          <span class="stat-label">佇列排隊中</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value" id="statApiCalls">0</span>
          <span class="stat-label">API 呼叫</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value" id="statCacheHits">0</span>
          <span class="stat-label">快取命中</span>
        </div>
      </section>

      <!-- 快取與除錯日誌管理 -->
      <div class="cache-row">
        <button class="btn-link" id="viewLogsBtn">檢視除錯日誌</button>
        <button class="btn-link danger" id="clearCache">清除所有快取</button>
      </div>

    </main>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
